name: Build & Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: softvence/huddlebiz-ai

jobs:

  build-and-push:
    name: Build & push Docker image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker stop huddlebiz-ai || true
            docker rm huddlebiz-ai || true
            docker run -d \
              --name huddlebiz-ai \
              --restart always \
              -p 8000:8000 \
              -e ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} \
              -e AI_SERVICE_TOKEN=${{ secrets.AI_SERVICE_TOKEN }} \
              -e BACKEND_API_URL=https://api.huddlebiz.com \
              -e CLAUDE_MODEL=claude-opus-4-5-20251101 \
              -e APP_ENV=production \
              -e DEBUG=false \
              -e HOST=0.0.0.0 \
              -e PORT=8000 \
              ${{ env.IMAGE_NAME }}:latest
            docker image prune -f
